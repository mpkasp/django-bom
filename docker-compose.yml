name: lithium_bom

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: .
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:bookworm-slim}
        DEBIAN_IMAGE: ${DOCKER_REGISTRY_MIRROR:-}debian:bookworm-slim
    entrypoint: ["sh", "entrypoint.sh"]
    command: >
      gunicorn bom.wsgi:application
      --bind 0.0.0.0:${API_PORT}
      --workers 3
      --timeout 120
      --log-level info
      --access-logfile -
      --error-logfile -
      --access-logformat '%(t)s %(h)s "%(r)s" %(s)s %(b)s %(D)s'
    volumes:
      - static_volume:/app/staticfiles
    expose:
      - ${API_PORT}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./.env.prod
  caddy:
    image: "${DOCKER_REGISTRY_MIRROR:-}caddy:2-alpine"
    volumes:
      - static_volume:/app/staticfiles
      - ./Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "${NGINX_PORT}:80"
      - "443:443"
    depends_on:
      - web
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ./.env.prod
  db:
    image: "${DOCKER_REGISTRY_MIRROR:-}postgres:17-alpine"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    env_file:
      - ./.env.prod
  backup:
    image: "${DOCKER_REGISTRY_MIRROR:-}postgres:17-alpine"
    env_file:
      - path: ./.env.prod
        required: true
      - path: ./.env.db
        required: false
    volumes:
      - ./postgres_backup:/backups
    entrypoint: >
      sh -c "
      echo '0 1 * * * PGPASSWORD=$POSTGRES_PASSWORD pg_dump -h db -p $SQL_PORT -U $POSTGRES_USER -d $POSTGRES_DB | gzip > /backups/dump_${POSTGRES_DB}_$(date +%Y-%m-%d_%H%M%S)GMT.sql.gz &&
      ls -tp /backups | grep -v /$ | tail -n +8 | xargs -I {} rm -- /backups/{}' | crontab - &&
      crond -f
      "
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
  monitor:
    image: "${DOCKER_REGISTRY_MIRROR:-}docker:cli"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./scripts/check-restart-loops.sh:/check-restart-loops.sh:ro
      - ./monitoring:/alerts
    entrypoint: ["/bin/sh", "/check-restart-loops.sh"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      COMPOSE_PROJECT_NAME: lithium_bom
      RESTART_ALERT_THRESHOLD: ${RESTART_ALERT_THRESHOLD:-5}
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-60}
      RESTART_ALERT_FILE: /alerts/restart-loops.log

volumes:
  postgres_data:
  static_volume:
