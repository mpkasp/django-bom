name: lithium_bom

services:
  web:
    build:
      context: .
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:bookworm-slim}
        DEBIAN_IMAGE: ${DOCKER_REGISTRY_MIRROR:-}debian:bookworm-slim
    entrypoint: ["sh", "entrypoint.sh"]
    command: gunicorn bom.wsgi:application --bind 0.0.0.0:${API_PORT} --workers 3 --timeout 120
    volumes:
      - static_volume:/app/staticfiles
    expose:
      - ${API_PORT}
    depends_on:
      - db
    restart: always
    env_file:
      - ./.env.prod
  caddy:
    image: "${DOCKER_REGISTRY_MIRROR:-}caddy:2-alpine"
    volumes:
      - static_volume:/app/staticfiles
      - ./Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "${NGINX_PORT}:80"
      - "443:443"
    depends_on:
      - web
    restart: always
    env_file:
      - ./.env.prod
  db:
    image: "${DOCKER_REGISTRY_MIRROR:-}postgres:17-alpine"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    restart: always
    env_file:
      - ./.env.prod
  backup:
    image: "${DOCKER_REGISTRY_MIRROR:-}postgres:17-alpine"
    env_file:
      - path: ./.env.prod
        required: true
      - path: ./.env.db
        required: false
    volumes:
      - ./postgres_backup:/backups
    entrypoint: >
      sh -c "
      echo '0 1 * * * PGPASSWORD=$POSTGRES_PASSWORD pg_dump -h db -p $SQL_PORT -U $POSTGRES_USER -d $POSTGRES_DB | gzip > /backups/dump_${POSTGRES_DB}_$(date +%Y-%m-%d_%H%M%S)GMT.sql.gz &&
      ls -tp /backups | grep -v /$ | tail -n +8 | xargs -I {} rm -- /backups/{}' | crontab - &&
      crond -f
      "
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
