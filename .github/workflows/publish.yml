name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Package
        run: |
          uv build
          uvx twine check dist/*

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  update-indabom:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Checkout indabom
        uses: actions/checkout@v5
        with:
          repository: mpkasp/indabom
          token: ${{ secrets.INDABOM_PAT }}
          path: indabom

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Wait for package on PyPI
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Poll the simple index (PEP 691 JSON) — this is what uv resolves against.
          # The /pypi/.../json metadata endpoint is a separate, differently-cached
          # service that can report the version as live before the simple index has
          # propagated it, causing uv lock to silently resolve the old version.
          for i in {1..30}; do
            if curl -sf -H "Accept: application/vnd.pypi.simple.v1+json" \
                 "https://pypi.org/simple/django-bom/" \
                 | grep -q "django_bom-${VERSION}\b"; then
              echo "✓ Found django-bom $VERSION on the PyPI simple index"
              exit 0
            fi
            echo "⏳ Attempt $i/30: django-bom $VERSION not yet on simple index, waiting..."
            sleep 10
          done
          echo "✗ Timeout: django-bom $VERSION not found on PyPI simple index after 300s"
          exit 1

      - name: Update django-bom in uv.lock
        working-directory: indabom
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # The simple-index check above and this resolve can hit different PyPI CDN
          # (Fastly) edges, so the index may still be stale for uv even once the check
          # passed. --refresh-package only clears uv's *local* cache — it can't fix a
          # stale edge — so retry the resolve until the lock actually pins $VERSION.
          for i in {1..30}; do
            uv lock --upgrade-package django-bom --refresh-package django-bom
            LOCKED_VERSION=$(grep -A2 'name = "django-bom"' uv.lock | grep 'version =' | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            echo "uv.lock now pins django-bom $LOCKED_VERSION (expected $VERSION)"
            if [ "$LOCKED_VERSION" = "$VERSION" ]; then
              exit 0
            fi
            echo "⏳ Attempt $i/30: uv.lock still on $LOCKED_VERSION, waiting for the index to propagate..."
            sleep 10
          done
          echo "✗ uv.lock did not update to $VERSION after 300s — aborting so no empty PR is opened."
          exit 1

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.INDABOM_PAT }}
          path: indabom
          commit-message: "chore: update django-bom to ${{ steps.version.outputs.version }}"
          title: "chore: update django-bom to ${{ steps.version.outputs.version }}"
          body: |
            Updates django-bom dependency to version ${{ steps.version.outputs.version }} from PyPI.

            Triggered by [django-bom release](https://github.com/mpkasp/django-bom/releases/tag/${{ github.ref_name }}).
          branch: update-django-bom
          delete-branch: true