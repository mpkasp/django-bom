name: Django CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [ 3.12, ]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pipenv'
      - name: Copy Local Settings
        shell: bash
        run: |
          cp bom/local_settings.py.example bom/local_settings.py
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --deploy --dev
      - name: Run Tests
        run: |
          pipenv run python manage.py test

  tag-release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Version Bump
        id: check
        run: |
          NEW_VER=$(grep -m 1 'version =' pyproject.toml | tr -d '"' | tr -d "'" | cut -d'=' -f2 | xargs)
          OLD_VER=$(git show HEAD~1:pyproject.toml | grep -m 1 'version =' | tr -d '"' | tr -d "'" | cut -d'=' -f2 | xargs)
          
          if [ "$NEW_VER" != "$OLD_VER" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$NEW_VER" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.check.outputs.version }}
          name: Release v${{ steps.check.outputs.version }}
          generate_release_notes: true
          token: ${{ secrets.RELEASE_TOKEN }}