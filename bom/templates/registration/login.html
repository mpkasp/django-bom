{% extends BASE_TEMPLATE %}

{% load static %}
{% load bom_forms %}

{% block head-title %}{% trans "Login" %}{% endblock %}

{% block content %}
    <div class="mx-auto max-w-md px-4 py-12">
        <div class="bom-panel-pad">
            <h1 class="mb-1 text-xl font-semibold text-ink">{% trans "Login" %}</h1>
            <p class="mb-6 text-sm text-ink-muted">{% trans "Login into your BoM account" %}</p>
            <form method="post" class="space-y-4">
                {% csrf_token %}
                {{ form|bom_form }}
                <button class="bom-btn-primary w-full" type="submit">{% trans "Login" %}</button>
            </form>
        </div>
    </div>
{% endblock %}
