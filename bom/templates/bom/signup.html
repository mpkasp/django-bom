{% extends 'bom/base.html' %}

{% load bom_forms %}
{% load static %}

{% block head-title %}ایجاد حساب{% endblock %}

{% block content %}
    <div class="mx-auto max-w-lg px-4 py-12">
        <div class="bom-panel-pad">
            <h1 class="mb-6 text-xl font-semibold text-ink">ایجاد حساب کاربری</h1>
            <form method="post" class="space-y-4">
                {% csrf_token %}
                {{ form|bom_form }}
                <button class="bom-btn-primary w-full" type="submit">تأیید</button>
            </form>
        </div>
    </div>
{% endblock %}
