{% extends 'bom/bom-base.html' %}

{% load materializecss %}
{% load static %}

{% block head-title %}{{ title }}{% endblock %}

{% block content %}
    <div class="container-app">
    <form name="seller" action="{{ action }}" method="post" enctype="multipart/form-data" class="col s12">
        <div class="row">
            {% csrf_token %}
            {{ form|materializecss:'m6 s12' }}
        </div>
        {% include 'bom/components/form-actions.html' with cancel_url=next_url only %}
    </form>
    </div>
{% endblock %}
