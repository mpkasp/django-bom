{% extends 'bom/bom-base.html' %}

{% load bom_forms %}
{% load static %}

{% block head-title %}{{ title }}{% endblock %}

{% block bom-menu %}
    <a class="bom-nav-link" href="javascript:history.back()">انصراف</a>
{% endblock %}

{% block content %}
    <div class="container-app">
    {% if h1 %}<h1 class="mb-4 text-xl font-semibold">{{ h1 }}</h1>{% endif %}
    <form name="seller" action="{{ action }}" method="post" class="bom-panel-pad">
        {% csrf_token %}
        {{ form|bom_form:'m6 s12' }}
        <div class="mt-4 flex justify-between">
            <a href="javascript:history.back()" class="bom-btn-ghost">انصراف</a>
            <button class="bom-btn-primary" type="submit" name="action">{% trans "Save" %}</button>
        </div>
    </form>
    </div>
{% endblock %}
