<span class="chip
    {% if change.status == 'applied' %}teal darken-2 white-text
    {% elif change.status == 'open' %}amber lighten-3 black-text
    {% elif change.status == 'rejected' %}red darken-1 white-text
    {% else %}grey lighten-2 grey-text text-darken-2
    {% endif %}">{{ change.get_status_display }}</span>{% if change.is_direct_edit %}<span class="chip grey lighten-3" title="Saved immediately on a Draft; recorded here for history">Direct edit</span>{% endif %}{% if is_eco %}<span class="chip deep-purple lighten-4" title="Engineering Change Order: edits a Released or In Review revision">ECO</span>{% endif %}
