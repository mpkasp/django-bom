{% load materializecss %}

<a class="waves-effect waves-light btn btn-primary modal-trigger modal-{{ name }}"
   href="#modal-{{ name }}">{{ modal_title }}</a>

<div id="modal-{{ name }}" class="modal left-align">
    <form name="seller" action="{{ action }}" method="post" class="col s12" enctype="multipart/form-data">
        <div class="modal-content">
            <h5>{{ modal_title }}</h5>
            {% if modal_description %}<p class="text-grey">{{ modal_description }}</p>{% endif %}
            <div class="row">
                {% if form %}
                    {% csrf_token %}
                    {{ form|materializecss:'m6 s12' }}
                {% endif %}
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="modal-close waves-effect btn-flat">Cancel</button>
            {% if form %}
                <button class="waves-effect waves-light btn btn-primary" type="submit" name="{{ name }}">Save</button>
            {% endif %}
        </div>
    </form>
</div>
