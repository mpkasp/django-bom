{% load bom_forms %}
{% load static %}

<a class="bom-btn-primary modal-trigger" href="#modal-{{ name }}">{{ modal_title }}</a>

<div id="modal-{{ name }}" class="modal">
    <form name="seller" action="{{ action }}" method="post" enctype="multipart/form-data">
        <div class="modal-content">
            {% if modal_title %}<h2 class="mb-2 text-lg font-semibold">{{ modal_title }}</h2>{% endif %}
            {% if modal_description %}<p class="mb-3 text-sm text-ink-muted">{{ modal_description }}</p>{% endif %}
            {% if form %}
                {% csrf_token %}
                {{ form|bom_form:'m6 s12' }}
            {% endif %}
        </div>
        <div class="modal-footer">
            <a href="#!" class="modal-close bom-btn-ghost">انصراف</a>
            {% if form %}
                <button class="bom-btn-primary" type="submit" name="{{ name }}">Submit</button>
            {% else %}
                <a href="#!" class="modal-close bom-btn-primary">Ok</a>
            {% endif %}
        </div>
    </form>
</div>
